<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kho & Sản phẩm - Quản Lý Bán Hàng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">🏪</span>
      <h2>Quản Lý Bán Hàng</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a href="kho.html" class="active">
        <span class="nav-icon">📦</span>
        <span>Kho & Sản phẩm</span>
      </a>
      <a href="don-hang.html">
        <span class="nav-icon">🧾</span>
        <span>Đơn hàng</span>
      </a>
      <a href="khach-hang.html">
        <span class="nav-icon">👥</span>
        <span>Khách hàng</span>
      </a>
      <a href="doi-mat-khau.html">
        <span class="nav-icon">🔑</span>
        <span>Đổi mật khẩu</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a onclick="logout()">
        <span class="nav-icon">🚪</span>
        <span>Đăng xuất</span>
      </a>
    </div>
  </aside>

  <!-- ===== NỘI DUNG CHÍNH ===== -->
  <main class="main-content">
    <!-- Header trang với nút thao tác -->
    <div class="page-header">
      <h1>📦 Kho & Sản phẩm</h1>
      <div class="header-actions">
        <button class="btn btn-success" onclick="openAddProduct()">
          ➕ Thêm sản phẩm
        </button>
        <button class="btn btn-warning" onclick="openNhapKho()">
          📥 Nhập kho
        </button>
      </div>
    </div>

    <!-- Bảng danh sách sản phẩm -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Mã SP</th>
            <th>Tên sản phẩm</th>
            <th>Giá bán</th>
            <th>Giá vốn</th>
            <th>Tồn kho</th>
            <th>Danh mục</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="productTable">
          <tr>
            <td colspan="7" class="text-center text-muted" style="padding: 32px;">
              Đang tải dữ liệu...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- ===== MODAL THÊM/SỬA SẢN PHẨM ===== -->
  <div class="modal-overlay" id="productModal">
    <div class="modal">
      <div class="modal-header">
        <h3 id="productModalTitle">Thêm sản phẩm mới</h3>
        <button class="modal-close" onclick="closeModal('productModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="productForm" onsubmit="handleSaveProduct(event)">
          <!-- Ẩn ID khi sửa -->
          <input type="hidden" id="productId">

          <div class="form-row">
            <div class="form-group">
              <label for="maSanPham">Mã sản phẩm</label>
              <input type="text" id="maSanPham" placeholder="VD: SP001" required>
            </div>
            <div class="form-group">
              <label for="danhMuc">Danh mục</label>
              <input type="text" id="danhMuc" placeholder="VD: Điện tử">
            </div>
          </div>

          <div class="form-group">
            <label for="tenSanPham">Tên sản phẩm</label>
            <input type="text" id="tenSanPham" placeholder="Nhập tên sản phẩm" required>
          </div>

          <div class="form-row">
            <div class="form-group">
              <label for="giaBan">Giá bán (VNĐ)</label>
              <input type="number" id="giaBan" placeholder="0" min="0" required>
            </div>
            <div class="form-group">
              <label for="giaVon">Giá vốn (VNĐ)</label>
              <input type="number" id="giaVon" placeholder="0" min="0" required>
            </div>
          </div>

          <div class="form-group">
            <label for="soLuongTon">Số lượng tồn kho</label>
            <input type="number" id="soLuongTon" placeholder="0" min="0" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('productModal')">Hủy</button>
        <button class="btn btn-primary" onclick="document.getElementById('productForm').requestSubmit()">
          💾 Lưu sản phẩm
        </button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL NHẬP KHO ===== -->
  <div class="modal-overlay" id="nhapKhoModal">
    <div class="modal">
      <div class="modal-header">
        <h3>📥 Nhập kho</h3>
        <button class="modal-close" onclick="closeModal('nhapKhoModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="nhapKhoForm" onsubmit="handleNhapKho(event)">
          <div class="form-group">
            <label for="nhapKhoProduct">Chọn sản phẩm</label>
            <select id="nhapKhoProduct" required>
              <option value="">-- Chọn sản phẩm --</option>
            </select>
          </div>
          <div class="form-group">
            <label for="nhapKhoQuantity">Số lượng nhập</label>
            <input type="number" id="nhapKhoQuantity" placeholder="Nhập số lượng" min="1" required>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('nhapKhoModal')">Hủy</button>
        <button class="btn btn-warning" onclick="document.getElementById('nhapKhoForm').requestSubmit()">
          📥 Nhập kho
        </button>
      </div>
    </div>
  </div>

  <!-- Kịch bản JavaScript -->
  <script src="js/api.js"></script>
  <script>
    // Kiểm tra xác thực
    checkAuth();

    // Lưu danh sách sản phẩm (để dùng ở nhiều nơi)
    let products = [];

    // Tải dữ liệu khi trang sẵn sàng
    document.addEventListener('DOMContentLoaded', loadProducts);

    /**
     * Tải danh sách sản phẩm từ API
     */
    async function loadProducts() {
      const data = await apiGet('/san-pham');
      if (!data) return;

      // Hỗ trợ cả 2 dạng: data trả trực tiếp hoặc data.data
      products = data.data || data || [];
      // Nếu data là mảng trực tiếp
      if (Array.isArray(data)) products = data;

      renderProductTable();
    }

    /**
     * Hiển thị bảng sản phẩm
     */
    function renderProductTable() {
      const tbody = document.getElementById('productTable');

      if (!products || products.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="7">
              <div class="empty-state">
                <span class="empty-icon">📦</span>
                <p>Chưa có sản phẩm nào. Hãy thêm sản phẩm mới!</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = products.map(p => `
        <tr>
          <td><strong>${p.maSanPham || ''}</strong></td>
          <td>${p.tenSanPham || ''}</td>
          <td class="text-right">${formatMoney(p.giaBan)}</td>
          <td class="text-right">${formatMoney(p.giaVon)}</td>
          <td class="text-center">
            <span class="badge ${(p.soLuongTon || 0) <= 10 ? 'badge-danger' : 'badge-success'}">
              ${p.soLuongTon || 0}
            </span>
          </td>
          <td>${p.danhMuc || '--'}</td>
          <td>
            <div class="action-buttons">
              <button class="btn btn-primary btn-sm" onclick="openEditProduct('${p.id}')">✏️ Sửa</button>
              <button class="btn btn-danger btn-sm" onclick="deleteProduct('${p.id}')">🗑️ Xóa</button>
            </div>
          </td>
        </tr>
      `).join('');
    }

    /**
     * Mở modal thêm sản phẩm mới
     */
    function openAddProduct() {
      // Reset form
      document.getElementById('productForm').reset();
      document.getElementById('productId').value = '';
      document.getElementById('productModalTitle').textContent = 'Thêm sản phẩm mới';
      openModal('productModal');
    }

    /**
     * Mở modal sửa sản phẩm
     * @param {string} id - ID sản phẩm cần sửa
     */
    function openEditProduct(id) {
      const product = products.find(p => p.id == id);
      if (!product) return;

      // Điền dữ liệu vào form
      document.getElementById('productId').value = product.id;
      document.getElementById('maSanPham').value = product.maSanPham || '';
      document.getElementById('tenSanPham').value = product.tenSanPham || '';
      document.getElementById('giaBan').value = product.giaBan || 0;
      document.getElementById('giaVon').value = product.giaVon || 0;
      document.getElementById('soLuongTon').value = product.soLuongTon || 0;
      document.getElementById('danhMuc').value = product.danhMuc || '';

      document.getElementById('productModalTitle').textContent = 'Sửa sản phẩm';
      openModal('productModal');
    }

    /**
     * Xử lý lưu sản phẩm (thêm mới hoặc cập nhật)
     */
    async function handleSaveProduct(e) {
      e.preventDefault();

      const id = document.getElementById('productId').value;
      const body = {
        maSanPham: document.getElementById('maSanPham').value.trim(),
        tenSanPham: document.getElementById('tenSanPham').value.trim(),
        giaBan: Number(document.getElementById('giaBan').value),
        giaVon: Number(document.getElementById('giaVon').value),
        soLuongTon: Number(document.getElementById('soLuongTon').value),
        danhMuc: document.getElementById('danhMuc').value.trim(),
      };

      let result;
      if (id) {
        // Cập nhật sản phẩm
        result = await apiPut('/san-pham/' + id, body);
      } else {
        // Thêm mới sản phẩm
        result = await apiPost('/san-pham', body);
      }

      if (result) {
        showToast(id ? 'Cập nhật sản phẩm thành công!' : 'Thêm sản phẩm thành công!');
        closeModal('productModal');
        loadProducts(); // Tải lại danh sách
      }
    }

    /**
     * Xóa sản phẩm
     * @param {string} id - ID sản phẩm cần xóa
     */
    async function deleteProduct(id) {
      if (!confirm('Bạn có chắc muốn xóa sản phẩm này?')) return;

      const result = await apiDelete('/san-pham/' + id);
      if (result) {
        showToast('Đã xóa sản phẩm!', 'success');
        loadProducts();
      }
    }

    /**
     * Mở modal nhập kho
     */
    function openNhapKho() {
      // Điền danh sách sản phẩm vào select
      const select = document.getElementById('nhapKhoProduct');
      select.innerHTML = '<option value="">-- Chọn sản phẩm --</option>';
      products.forEach(p => {
        select.innerHTML += `<option value="${p.id}">${p.maSanPham} - ${p.tenSanPham} (Tồn: ${p.soLuongTon || 0})</option>`;
      });

      document.getElementById('nhapKhoForm').reset();
      openModal('nhapKhoModal');
    }

    /**
     * Xử lý nhập kho
     */
    async function handleNhapKho(e) {
      e.preventDefault();

      const sanPhamId = document.getElementById('nhapKhoProduct').value;
      const soLuong = Number(document.getElementById('nhapKhoQuantity').value);

      if (!sanPhamId || soLuong <= 0) {
        showToast('Vui lòng chọn sản phẩm và nhập số lượng hợp lệ!', 'warning');
        return;
      }

      const result = await apiPost('/san-pham/nhap-kho', { sanPhamId, soLuong });

      if (result) {
        showToast('Nhập kho thành công!');
        closeModal('nhapKhoModal');
        loadProducts();
      }
    }
  </script>
</body>
</html>
