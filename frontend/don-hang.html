<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đơn hàng - Quản Lý Bán Hàng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="sidebar-header">
      <span class="logo-icon">🏪</span>
      <h2>Quản Lý Bán Hàng</h2>
    </div>
    <nav class="sidebar-nav">
      <a href="index.html">
        <span class="nav-icon">📊</span>
        <span>Dashboard</span>
      </a>
      <a href="kho.html">
        <span class="nav-icon">📦</span>
        <span>Kho & Sản phẩm</span>
      </a>
      <a href="don-hang.html" class="active">
        <span class="nav-icon">🧾</span>
        <span>Đơn hàng</span>
      </a>
      <a href="khach-hang.html">
        <span class="nav-icon">👥</span>
        <span>Khách hàng</span>
      </a>
      <a href="doi-mat-khau.html">
        <span class="nav-icon">🔑</span>
        <span>Đổi mật khẩu</span>
      </a>
    </nav>
    <div class="sidebar-footer">
      <a onclick="logout()">
        <span class="nav-icon">🚪</span>
        <span>Đăng xuất</span>
      </a>
    </div>
  </aside>

  <!-- ===== NỘI DUNG CHÍNH ===== -->
  <main class="main-content">
    <div class="page-header">
      <h1>🧾 Đơn hàng</h1>
      <div class="header-actions">
        <button class="btn btn-primary" onclick="openCreateOrder()">
          ➕ Tạo đơn hàng
        </button>
      </div>
    </div>

    <!-- Bảng danh sách đơn hàng -->
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Mã đơn</th>
            <th>Khách hàng</th>
            <th>Tổng tiền</th>
            <th>Trạng thái</th>
            <th>Ngày tạo</th>
            <th>Thao tác</th>
          </tr>
        </thead>
        <tbody id="orderTable">
          <tr>
            <td colspan="6" class="text-center text-muted" style="padding: 32px;">
              Đang tải dữ liệu...
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </main>

  <!-- ===== MODAL TẠO ĐƠN HÀNG ===== -->
  <div class="modal-overlay" id="createOrderModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>➕ Tạo đơn hàng mới</h3>
        <button class="modal-close" onclick="closeModal('createOrderModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="createOrderForm" onsubmit="handleCreateOrder(event)">
          <!-- Chọn khách hàng -->
          <div class="form-group">
            <label for="orderCustomer">Khách hàng</label>
            <select id="orderCustomer" required>
              <option value="">-- Chọn khách hàng --</option>
            </select>
          </div>

          <!-- Thêm sản phẩm vào đơn -->
          <div class="form-group">
            <label>Sản phẩm</label>
            <div class="order-item-row">
              <div class="form-group" style="margin-bottom:0">
                <select id="addProductSelect">
                  <option value="">-- Chọn sản phẩm --</option>
                </select>
              </div>
              <div class="form-group" style="margin-bottom:0">
                <input type="number" id="addProductQty" placeholder="SL" min="1" value="1">
              </div>
              <div class="form-group" style="margin-bottom:0">
                <span id="addProductPrice" class="text-muted">0 đ</span>
              </div>
              <button type="button" class="btn btn-success btn-sm" onclick="addOrderItem()">➕</button>
            </div>
          </div>

          <!-- Danh sách sản phẩm đã thêm -->
          <div class="order-items-list" id="orderItemsList">
            <!-- Sản phẩm được thêm sẽ hiện ở đây -->
          </div>

          <!-- Tổng tiền -->
          <div class="order-summary" id="orderSummary" style="display:none;">
            <div class="total-row">
              <span>Tổng cộng:</span>
              <span id="orderTotal">0 đ</span>
            </div>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('createOrderModal')">Hủy</button>
        <button class="btn btn-primary" onclick="document.getElementById('createOrderForm').requestSubmit()">
          🧾 Tạo đơn hàng
        </button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL CHI TIẾT ĐƠN HÀNG ===== -->
  <div class="modal-overlay" id="orderDetailModal">
    <div class="modal modal-lg">
      <div class="modal-header">
        <h3>📋 Chi tiết đơn hàng</h3>
        <button class="modal-close" onclick="closeModal('orderDetailModal')">&times;</button>
      </div>
      <div class="modal-body" id="orderDetailContent">
        <!-- Nội dung chi tiết sẽ được render ở đây -->
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('orderDetailModal')">Đóng</button>
      </div>
    </div>
  </div>

  <!-- ===== MODAL CẬP NHẬT TRẠNG THÁI ===== -->
  <div class="modal-overlay" id="statusModal">
    <div class="modal">
      <div class="modal-header">
        <h3>🔄 Cập nhật trạng thái</h3>
        <button class="modal-close" onclick="closeModal('statusModal')">&times;</button>
      </div>
      <div class="modal-body">
        <form id="statusForm" onsubmit="handleUpdateStatus(event)">
          <input type="hidden" id="statusOrderId">
          <div class="form-group">
            <label for="newStatus">Trạng thái mới</label>
            <select id="newStatus" required>
              <option value="CHO_XAC_NHAN">Chờ xác nhận</option>
              <option value="DA_XAC_NHAN">Đã xác nhận</option>
              <option value="DANG_GIAO">Đang giao</option>
              <option value="HOAN_THANH">Hoàn thành</option>
              <option value="DA_HUY">Đã hủy</option>
            </select>
          </div>
        </form>
      </div>
      <div class="modal-footer">
        <button class="btn btn-outline" onclick="closeModal('statusModal')">Hủy</button>
        <button class="btn btn-primary" onclick="document.getElementById('statusForm').requestSubmit()">
          ✅ Cập nhật
        </button>
      </div>
    </div>
  </div>

  <!-- Kịch bản JavaScript -->
  <script src="js/api.js"></script>
  <script>
    // Kiểm tra xác thực
    checkAuth();

    // Dữ liệu toàn cục
    let orders = [];
    let customers = [];
    let products = [];
    let orderItems = []; // Các sản phẩm trong đơn hàng đang tạo

    // Ánh xạ trạng thái sang tiếng Việt và màu badge
    const STATUS_MAP = {
      'CHO_XAC_NHAN': { label: 'Chờ xác nhận', badge: 'badge-warning' },
      'DA_XAC_NHAN':  { label: 'Đã xác nhận',  badge: 'badge-info' },
      'DANG_GIAO':    { label: 'Đang giao',     badge: 'badge-info' },
      'HOAN_THANH':   { label: 'Hoàn thành',    badge: 'badge-success' },
      'DA_HUY':       { label: 'Đã hủy',        badge: 'badge-danger' },
    };

    // Tải dữ liệu khi trang sẵn sàng
    document.addEventListener('DOMContentLoaded', async () => {
      await loadOrders();
      // Tải sẵn khách hàng và sản phẩm cho form tạo đơn
      await loadCustomersAndProducts();
    });

    // Cập nhật giá hiển thị khi chọn sản phẩm
    document.addEventListener('DOMContentLoaded', () => {
      const selectEl = document.getElementById('addProductSelect');
      if (selectEl) {
        selectEl.addEventListener('change', () => {
          const product = products.find(p => p.id == selectEl.value);
          document.getElementById('addProductPrice').textContent = product ? formatMoney(product.giaBan) : '0 đ';
        });
      }
    });

    /**
     * Tải danh sách đơn hàng
     */
    async function loadOrders() {
      const data = await apiGet('/don-hang');
      if (!data) return;

      orders = data.data || data || [];
      if (Array.isArray(data)) orders = data;
      renderOrderTable();
    }

    /**
     * Tải danh sách khách hàng và sản phẩm (dùng cho form tạo đơn)
     */
    async function loadCustomersAndProducts() {
      const [custData, prodData] = await Promise.all([
        apiGet('/khach-hang'),
        apiGet('/san-pham'),
      ]);

      customers = custData ? (custData.data || custData || []) : [];
      if (Array.isArray(custData)) customers = custData;

      products = prodData ? (prodData.data || prodData || []) : [];
      if (Array.isArray(prodData)) products = prodData;
    }

    /**
     * Hiển thị bảng đơn hàng
     */
    function renderOrderTable() {
      const tbody = document.getElementById('orderTable');

      if (!orders || orders.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="6">
              <div class="empty-state">
                <span class="empty-icon">🧾</span>
                <p>Chưa có đơn hàng nào</p>
              </div>
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = orders.map(o => {
        const statusInfo = STATUS_MAP[o.trangThai] || { label: o.trangThai || '--', badge: 'badge-secondary' };
        return `
          <tr>
            <td><strong>${o.maDonHang || o.id || ''}</strong></td>
            <td>${o.tenKhachHang || o.khachHang?.hoTen || '--'}</td>
            <td class="text-right">${formatMoney(o.tongTien)}</td>
            <td>
              <span class="badge ${statusInfo.badge}">${statusInfo.label}</span>
            </td>
            <td>${formatDate(o.ngayTao || o.createdAt)}</td>
            <td>
              <div class="action-buttons">
                <button class="btn btn-primary btn-sm" onclick="viewOrderDetail('${o.id}')">👁️ Xem</button>
                <button class="btn btn-warning btn-sm" onclick="openUpdateStatus('${o.id}', '${o.trangThai || ''}')">🔄 TT</button>
              </div>
            </td>
          </tr>
        `;
      }).join('');
    }

    /**
     * Mở modal tạo đơn hàng mới
     */
    function openCreateOrder() {
      // Reset dữ liệu đơn hàng
      orderItems = [];

      // Điền danh sách khách hàng
      const custSelect = document.getElementById('orderCustomer');
      custSelect.innerHTML = '<option value="">-- Chọn khách hàng --</option>';
      customers.forEach(c => {
        custSelect.innerHTML += `<option value="${c.id}">${c.hoTen} - ${c.soDienThoai || ''}</option>`;
      });

      // Điền danh sách sản phẩm
      const prodSelect = document.getElementById('addProductSelect');
      prodSelect.innerHTML = '<option value="">-- Chọn sản phẩm --</option>';
      products.forEach(p => {
        prodSelect.innerHTML += `<option value="${p.id}">${p.tenSanPham} (${formatMoney(p.giaBan)}) - Tồn: ${p.soLuongTon || 0}</option>`;
      });

      document.getElementById('addProductQty').value = 1;
      document.getElementById('addProductPrice').textContent = '0 đ';
      renderOrderItems();

      openModal('createOrderModal');
    }

    /**
     * Thêm sản phẩm vào đơn hàng
     */
    function addOrderItem() {
      const productId = document.getElementById('addProductSelect').value;
      const qty = Number(document.getElementById('addProductQty').value);

      if (!productId) {
        showToast('Vui lòng chọn sản phẩm!', 'warning');
        return;
      }
      if (qty <= 0) {
        showToast('Số lượng phải lớn hơn 0!', 'warning');
        return;
      }

      // Kiểm tra đã có trong danh sách chưa
      const existing = orderItems.find(i => i.sanPhamId == productId);
      if (existing) {
        existing.soLuong += qty;
      } else {
        const product = products.find(p => p.id == productId);
        orderItems.push({
          sanPhamId: productId,
          tenSanPham: product.tenSanPham,
          giaBan: product.giaBan,
          soLuong: qty,
        });
      }

      renderOrderItems();

      // Reset lại select
      document.getElementById('addProductSelect').value = '';
      document.getElementById('addProductQty').value = 1;
      document.getElementById('addProductPrice').textContent = '0 đ';
    }

    /**
     * Xóa sản phẩm khỏi đơn hàng
     */
    function removeOrderItem(index) {
      orderItems.splice(index, 1);
      renderOrderItems();
    }

    /**
     * Hiển thị danh sách sản phẩm đã thêm vào đơn
     */
    function renderOrderItems() {
      const list = document.getElementById('orderItemsList');
      const summary = document.getElementById('orderSummary');

      if (orderItems.length === 0) {
        list.innerHTML = '<p class="text-center text-muted" style="padding: 16px;">Chưa có sản phẩm nào trong đơn</p>';
        summary.style.display = 'none';
        return;
      }

      let total = 0;
      list.innerHTML = '<table style="width:100%"><thead><tr><th>Sản phẩm</th><th>SL</th><th>Đơn giá</th><th>Thành tiền</th><th></th></tr></thead><tbody>' +
        orderItems.map((item, idx) => {
          const subtotal = item.giaBan * item.soLuong;
          total += subtotal;
          return `
            <tr>
              <td>${item.tenSanPham}</td>
              <td class="text-center">${item.soLuong}</td>
              <td class="text-right">${formatMoney(item.giaBan)}</td>
              <td class="text-right"><strong>${formatMoney(subtotal)}</strong></td>
              <td>
                <button type="button" class="btn btn-danger btn-sm" onclick="removeOrderItem(${idx})">✕</button>
              </td>
            </tr>
          `;
        }).join('') + '</tbody></table>';

      // Hiện tổng tiền
      summary.style.display = 'block';
      document.getElementById('orderTotal').textContent = formatMoney(total);
    }

    /**
     * Xử lý tạo đơn hàng
     */
    async function handleCreateOrder(e) {
      e.preventDefault();

      const khachHangId = document.getElementById('orderCustomer').value;
      if (!khachHangId) {
        showToast('Vui lòng chọn khách hàng!', 'warning');
        return;
      }
      if (orderItems.length === 0) {
        showToast('Vui lòng thêm ít nhất 1 sản phẩm!', 'warning');
        return;
      }

      const body = {
        khachHangId,
        chiTiet: orderItems.map(i => ({
          sanPhamId: i.sanPhamId,
          soLuong: i.soLuong,
        })),
      };

      const result = await apiPost('/don-hang', body);
      if (result) {
        showToast('Tạo đơn hàng thành công!');
        closeModal('createOrderModal');
        loadOrders();
      }
    }

    /**
     * Xem chi tiết đơn hàng
     */
    async function viewOrderDetail(id) {
      const data = await apiGet('/don-hang/' + id);
      if (!data) return;

      const order = data.data || data;
      const statusInfo = STATUS_MAP[order.trangThai] || { label: order.trangThai || '--', badge: 'badge-secondary' };

      const content = document.getElementById('orderDetailContent');
      content.innerHTML = `
        <div style="margin-bottom: 16px;">
          <p><strong>Mã đơn hàng:</strong> ${order.maDonHang || order.id || ''}</p>
          <p><strong>Khách hàng:</strong> ${order.tenKhachHang || order.khachHang?.hoTen || '--'}</p>
          <p><strong>Ngày tạo:</strong> ${formatDate(order.ngayTao || order.createdAt)}</p>
          <p><strong>Trạng thái:</strong> <span class="badge ${statusInfo.badge}">${statusInfo.label}</span></p>
        </div>
        <div class="table-container" style="box-shadow: none; border: none;">
          <table>
            <thead>
              <tr>
                <th>Sản phẩm</th>
                <th>Số lượng</th>
                <th>Đơn giá</th>
                <th>Thành tiền</th>
              </tr>
            </thead>
            <tbody>
              ${(order.chiTiet || order.chiTietDonHang || []).map(d => `
                <tr>
                  <td>${d.tenSanPham || d.sanPham?.tenSanPham || ''}</td>
                  <td class="text-center">${d.soLuong || 0}</td>
                  <td class="text-right">${formatMoney(d.giaBan || d.donGia)}</td>
                  <td class="text-right"><strong>${formatMoney((d.giaBan || d.donGia || 0) * (d.soLuong || 0))}</strong></td>
                </tr>
              `).join('') || '<tr><td colspan="4" class="text-center text-muted">Không có chi tiết</td></tr>'}
            </tbody>
          </table>
        </div>
        <div class="order-summary mt-2">
          <div class="total-row">
            <span>Tổng cộng:</span>
            <span>${formatMoney(order.tongTien)}</span>
          </div>
        </div>
      `;

      openModal('orderDetailModal');
    }

    /**
     * Mở modal cập nhật trạng thái đơn hàng
     */
    function openUpdateStatus(id, currentStatus) {
      document.getElementById('statusOrderId').value = id;
      document.getElementById('newStatus').value = currentStatus || 'CHO_XAC_NHAN';
      openModal('statusModal');
    }

    /**
     * Xử lý cập nhật trạng thái
     */
    async function handleUpdateStatus(e) {
      e.preventDefault();

      const id = document.getElementById('statusOrderId').value;
      const trangThai = document.getElementById('newStatus').value;

      const result = await apiPut('/don-hang/' + id + '/trang-thai', { trangThai });
      if (result) {
        showToast('Cập nhật trạng thái thành công!');
        closeModal('statusModal');
        loadOrders();
      }
    }
  </script>
</body>
</html>
