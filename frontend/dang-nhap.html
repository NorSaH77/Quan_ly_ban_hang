<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng Nhập - Quản Lý Bán Hàng</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-page">

  <!-- Thẻ đăng nhập chính giữa màn hình -->
  <div class="login-card">
    <!-- Tiêu đề -->
    <div class="login-header">
      <span class="login-icon">🏪</span>
      <h1>Hệ Thống Quản Lý Bán Hàng</h1>
      <p>Đăng nhập để tiếp tục</p>
    </div>

    <!-- Thông báo lỗi (ẩn mặc định) -->
    <div class="login-error" id="loginError"></div>

    <!-- Form đăng nhập -->
    <form id="loginForm" onsubmit="handleLogin(event)">
      <!-- Trường Email -->
      <div class="form-group">
        <label for="email">📧 Email</label>
        <input
          type="email"
          id="email"
          placeholder="Nhập email của bạn"
          required
          autocomplete="email"
        >
      </div>

      <!-- Trường Mật khẩu -->
      <div class="form-group">
        <label for="password">🔒 Mật khẩu</label>
        <input
          type="password"
          id="password"
          placeholder="Nhập mật khẩu"
          required
          autocomplete="current-password"
        >
      </div>

      <!-- Nút đăng nhập -->
      <button type="submit" class="btn btn-primary btn-lg" id="btnLogin">
        Đăng Nhập
      </button>
    </form>
  </div>

  <!-- Kịch bản JavaScript -->
  <script src="js/api.js"></script>
  <script>
    // Nếu đã đăng nhập rồi thì chuyển thẳng về trang chủ
    if (isLoggedIn()) {
      window.location.href = 'index.html';
    }

    /**
     * Xử lý sự kiện đăng nhập
     * @param {Event} e - Sự kiện submit form
     */
    async function handleLogin(e) {
      // Ngăn form gửi theo cách mặc định
      e.preventDefault();

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const btnLogin = document.getElementById('btnLogin');
      const errorDiv = document.getElementById('loginError');

      // Ẩn thông báo lỗi cũ
      errorDiv.classList.remove('show');

      // Hiển thị trạng thái đang xử lý
      btnLogin.disabled = true;
      btnLogin.innerHTML = '<span class="spinner"></span> Đang đăng nhập...';

      try {
        // Gọi API đăng nhập qua api.js
        const data = await apiPost('/auth/login', { email, password });

        if (data.success && data.data && data.data.token) {
          // Đăng nhập thành công → lưu token và chuyển trang
          setToken(data.data.token);

          // Lưu thêm thông tin người dùng (tùy chọn)
          if (data.data.hoTen) {
            localStorage.setItem('hoTen', data.data.hoTen);
          }
          if (data.data.vaiTro) {
            localStorage.setItem('vaiTro', data.data.vaiTro);
          }

          window.location.href = 'index.html';
        } else {
          // Đăng nhập thất bại → hiện lỗi
          errorDiv.textContent = data.message || 'Email hoặc mật khẩu không đúng!';
          errorDiv.classList.add('show');
        }
      } catch (error) {
        // Lỗi kết nối
        errorDiv.textContent = 'Không thể kết nối đến máy chủ. Vui lòng thử lại!';
        errorDiv.classList.add('show');
      } finally {
        // Khôi phục nút bấm
        btnLogin.disabled = false;
        btnLogin.innerHTML = 'Đăng Nhập';
      }
    }
  </script>
</body>
</html>
